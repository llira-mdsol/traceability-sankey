<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDSO Traceability Sankey Diagram</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #16213e;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            color: #4fc3f7;
            white-space: nowrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #90caf9;
            white-space: nowrap;
        }

        .input-group input {
            background: #0d1b2a;
            border: 1px solid #0f3460;
            color: #e0e0e0;
            padding: 0.35rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 160px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        .btn {
            background: #0f3460;
            color: #4fc3f7;
            border: 1px solid #4fc3f7;
            padding: 0.35rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #1a4a7a;
        }

        .btn-green {
            border-color: #66bb6a;
            color: #66bb6a;
        }

        .btn-reset {
            border-color: #ffab40;
            color: #ffab40;
        }

        .legend {
            display: flex;
            gap: 0.7rem;
            margin-left: auto;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.7rem;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        #chart-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: grab;
            min-height: 500px;
        }

        #chart-container:active {
            cursor: grabbing;
        }

        #sankey-chart {
            width: 100%;
            height: 100%;
        }

        .status-bar {
            background: #16213e;
            padding: 0.4rem 1.5rem;
            border-top: 1px solid #0f3460;
            font-size: 0.75rem;
            color: #78909c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .status-bar .data-source {
            color: #ffab40;
        }

        .zoom-info {
            color: #546e7a;
            font-style: italic;
        }

        /* Sankey node labels */
        .node-label {
            font-size: 10px;
            fill: #b0bec5;
            pointer-events: none;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: #16213e;
            border: 1px solid #4fc3f7;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #e0e0e0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 100;
            max-width: 300px;
        }

        .tooltip .tt-title {
            font-weight: 600;
            color: #4fc3f7;
            margin-bottom: 4px;
        }

        .tooltip .tt-row {
            color: #90a4ae;
            font-size: 0.7rem;
        }

        /* Layer column headers */
        .layer-header {
            font-size: 11px;
            font-weight: 600;
            text-anchor: middle;
            fill: #546e7a;
        }

        #loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #4fc3f7;
            z-index: 1000;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #0f3460;
            border-top: 3px solid #4fc3f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <h1>🔗 Traceability Sankey</h1>
        <div class="input-group">
            <label for="mdso-ref">MDSO Project:</label>
            <input type="text" id="mdso-ref" placeholder="e.g. MDSO-1234" value="MDSO-1001">
        </div>
        <button class="btn" id="loadBtn" onclick="loadDiagram()">Load Sample</button>
        <button class="btn btn-green" id="importBtn" onclick="document.getElementById('json-file').click()">Import JSON</button>
        <button class="btn btn-green" id="pasteBtn" onclick="pasteFromClipboard()">Paste JSON</button>
        <button class="btn btn-reset" id="resetZoomBtn" onclick="resetZoom()">Reset Zoom</button>
        <input type="file" id="json-file" accept=".json" style="display:none" onchange="importJSONFile(event)">
        <div class="legend" id="legend"></div>
    </header>

    <div id="chart-container">
        <svg id="sankey-chart"></svg>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="status-bar">
        <span id="status-text">Ready — enter an MDSO project reference and click Load</span>
        <span class="zoom-info" id="zoom-info">Scroll to zoom • Drag to pan</span>
        <span class="data-source" id="data-source">Data: Sample</span>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading traceability data...</p>
    </div>

    <script src="data.js"></script>
    <script src="sankey.js"></script>
</body>
</html>
