<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDSO Traceability Sankey Diagram</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1.3rem;
            color: #4fc3f7;
            white-space: nowrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #90caf9;
            white-space: nowrap;
        }

        .input-group input {
            background: #0d1b2a;
            border: 1px solid #0f3460;
            color: #e0e0e0;
            padding: 0.4rem 0.75rem;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 200px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }

        button#loadBtn {
            background: #0f3460;
            color: #4fc3f7;
            border: 1px solid #4fc3f7;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        button#loadBtn:hover {
            background: #1a4a7a;
        }

        .legend {
            display: flex;
            gap: 1rem;
            margin-left: auto;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        #chart-container {
            flex: 1;
            padding: 1rem;
            min-height: 600px;
        }

        #sankey-chart {
            width: 100%;
            height: 100%;
            min-height: 580px;
        }

        .status-bar {
            background: #16213e;
            padding: 0.5rem 2rem;
            border-top: 1px solid #0f3460;
            font-size: 0.8rem;
            color: #78909c;
            display: flex;
            justify-content: space-between;
        }

        .status-bar .data-source {
            color: #ffab40;
        }

        #loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #4fc3f7;
            z-index: 1000;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #0f3460;
            border-top: 3px solid #4fc3f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <h1>🔗 Traceability Sankey</h1>
        <div class="input-group">
            <label for="mdso-ref">MDSO Project:</label>
            <input type="text" id="mdso-ref" placeholder="e.g. MDSO-1234" value="MDSO-1001">
        </div>
        <button id="loadBtn" onclick="loadDiagram()">Load Traceability</button>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#e57373"></div>Objectives</div>
            <div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>Initiatives</div>
            <div class="legend-item"><div class="legend-dot" style="background:#fff176"></div>MDSO Projects</div>
            <div class="legend-item"><div class="legend-dot" style="background:#81c784"></div>Epics/Features</div>
            <div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>Stories</div>
            <div class="legend-item"><div class="legend-dot" style="background:#ce93d8"></div>PRs</div>
        </div>
    </header>

    <div id="chart-container">
        <div id="sankey-chart"></div>
    </div>

    <div class="status-bar">
        <span id="status-text">Ready — enter an MDSO project reference and click Load</span>
        <span class="data-source" id="data-source">Data: Sample (see README for API integration)</span>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading traceability data...</p>
    </div>

    <script src="data.js"></script>
    <script src="sankey.js"></script>
</body>
</html>
